name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build & Release
    runs-on: windows-latest
    if: >
      github.repository_owner == 'LeagueToolkit' && (
        github.event_name == 'push' ||
        (github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/v'))
      )
    permissions:
      contents: write
      # The cache service refuses a write unless the token carries `actions`.
      # Without it every dependency in Cargo.lock is rebuilt from cold.
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BRANCH="${{ github.event.pull_request.head.ref }}"
            VERSION="${BRANCH#release/v}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          echo "::notice::Releasing v$VERSION"

      - name: Create tag
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Delete release branch
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git push origin --delete "${{ github.event.pull_request.head.ref }}" || true

      - name: Validate version consistency
        if: github.event_name == 'push'
        shell: bash
        run: |
          CARGO_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          if [ "$CARGO_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag version (${{ steps.version.outputs.version }}) does not match Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi

      - name: Generate changelog
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header

      # A release body is read by whoever installs the build, and a commit
      # subject is written in the codebase's own vocabulary. `docs/releases/`
      # is where the first is said, and the generated commit list stands in
      # only for a release nobody wrote notes for.
      - name: Compose release notes
        id: notes
        shell: bash
        env:
          GENERATED: ${{ steps.changelog.outputs.content }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          REPO="https://github.com/LeagueToolkit/ltk-manager"
          MSI="LTK.Manager_${VERSION}_x64_en-US.msi"
          WRITTEN="docs/releases/$VERSION.md"

          if [ -f "$WRITTEN" ]; then
            BODY=$(cat "$WRITTEN")
          else
            echo "::warning::No $WRITTEN. Falling back to the generated commit list."
            BODY="$GENERATED"
          fi

          NOTES="$RUNNER_TEMP/release-notes.md"
          {
            echo "👉 **Download** [\`$MSI\`]($REPO/releases/download/$TAG/$MSI)"
            echo
            echo "## [$VERSION]($REPO/releases/tag/$TAG) - $(date -u +%Y-%m-%d)"
            echo
            printf '%s\n' "$BODY"
          } > "$NOTES"

          {
            echo "body<<RELEASE_NOTES_EOF"
            cat "$NOTES"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # Both restore only. This job runs on `refs/pull/N/merge`, and a cache
      # written from a pull request ref is unreadable by the next release.
      # ci.yml's `warm-release-cache` writes these on `main`.
      - name: Restore pnpm store
        uses: actions/cache/restore@v4
        with:
          path: ~\AppData\Local\pnpm\store
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          save-if: false

      # Building this from source cost four minutes a release. Upstream renamed
      # the crate to artifact-signing-cli, but the signCommand in
      # tauri.conf.json still invokes it under the old name.
      - name: Install trusted-signing-cli
        shell: pwsh
        env:
          SIGNING_CLI_VERSION: "0.11.0"
          SIGNING_CLI_SHA256: "ddc6f6ef68631bf367ad051d7d37109e58d46095406e1fbba60d553b10f94393"
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "signing-cli"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $exe = Join-Path $dir "trusted-signing-cli.exe"
          $url = "https://github.com/Levminer/trusted-signing-cli/releases/download/$env:SIGNING_CLI_VERSION/artifact-signing-cli.exe"
          Invoke-WebRequest -Uri $url -OutFile $exe
          # This binary runs with the Azure signing credentials in its environment.
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash
          if ($hash -ne $env:SIGNING_CLI_SHA256) {
            throw "Checksum mismatch for $url (got $hash)"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $dir

      - name: Locate signtool.exe
        id: signtool
        shell: pwsh
        run: |
          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "signtool.exe" |
            Where-Object { $_.FullName -like "*\x64\*" } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found" }
          echo "SIGNTOOL_PATH=$($signtool.FullName)" >> $env:GITHUB_OUTPUT

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Patch tauri.conf.json
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const path = 'src-tauri/tauri.conf.json';
            const conf = JSON.parse(fs.readFileSync(path, 'utf8'));
            conf.version = process.argv[1];
            if (process.argv[2] === 'true') {
              conf.bundle.targets = ['nsis'];
            }
            fs.writeFileSync(path, JSON.stringify(conf, null, 2) + '\n');
          " "${{ steps.version.outputs.version }}" "${{ steps.version.outputs.prerelease }}"

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          # Read by `option_env!` at compile time. A build without it reports no
          # diagnostics, so a fork releases without collecting anything.
          LTK_POSTHOG_API_KEY: ${{ secrets.LTK_POSTHOG_API_KEY }}
          # Read by `scripts/upload-source-maps.mjs`, between the frontend build
          # and the bundle. Absent, the maps are deleted rather than uploaded, so
          # a fork and the pull request workflow ship the same installer.
          POSTHOG_CLI_HOST: https://eu.posthog.com
          POSTHOG_CLI_PROJECT_ID: ${{ secrets.POSTHOG_CLI_PROJECT_ID }}
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
          SIGNTOOL_PATH: ${{ steps.signtool.outputs.SIGNTOOL_PATH }}
        with:
          tagName: ${{ steps.version.outputs.tag }}
          releaseName: "LTK Manager v${{ steps.version.outputs.version }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: ${{ steps.version.outputs.prerelease }}
          updaterJsonPreferNsis: true

      - name: Update updater release
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"

          # Download latest.json from the release we just created
          gh release download "$TAG" --pattern "latest.json" --dir . --clobber

          # Upload to the pinned "updater" release
          if gh release view updater &>/dev/null; then
            gh release upload updater latest.json --clobber
          else
            gh release create updater latest.json \
              --title "Updater" \
              --notes "Auto-updated by CI. Contains the latest updater manifest for in-app updates." \
              --latest=false
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
