# ltk_mapgeo 0.3.0 off crates.io with league-toolkit PR #260 applied: the reader drops a
# vertex buffer no mesh references.

[package]
edition = "2021"
name = "ltk_mapgeo"
version = "0.3.0"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Map Geometry (.mapgeo) parsing for League Toolkit"
readme = "README.md"
license = "Apache-2.0"

[lib]
name = "ltk_mapgeo"
path = "src/lib.rs"

[dependencies.bitflags]
version = "2.5.0"

[dependencies.byteorder]
version = "1.5.0"

[dependencies.glam]
version = "0.27.0"
features = ["glam-assert"]

[dependencies.ltk_io_ext]
version = "0.4.7"

[dependencies.ltk_mesh]
version = "0.5.2"

[dependencies.ltk_primitives]
version = "0.3.6"

[dependencies.thiserror]
version = "1.0.60"

[lints.clippy.complexity]
level = "warn"
priority = -1

[lints.clippy.correctness]
level = "deny"
priority = -1

[lints.clippy.pedantic]
level = "allow"
priority = -1

[lints.clippy.perf]
level = "warn"
priority = -1

[lints.clippy.style]
level = "warn"
priority = -1

[lints.clippy.suspicious]
level = "deny"
priority = -1

[lints.rust]
warnings = "warn"
