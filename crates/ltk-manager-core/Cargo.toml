[package]
name = "ltk-manager-core"
version = "0.1.0"
description = "Patching sessions, install links and release feeds for LTK Manager"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/LeagueToolkit/ltk-manager"
publish = false

[features]
# Derive `specta::Type` on the types that cross IPC, so the Tauri shell can export bindings.
ts = [
    "dep:specta",
    "ltk-manager-assets/ts",
    "ltk-manager-base/ts",
    "ltk-manager-library/ts",
    "ltk-manager-runtime/ts",
    "ltk-manager-workshop/ts",
]

[dependencies]
ltk-manager-assets = { workspace = true }
ltk-manager-base = { workspace = true }
ltk-manager-library = { workspace = true }
ltk-manager-runtime = { workspace = true }
ltk-manager-workshop = { workspace = true }

chrono = { workspace = true }
fs-err = { workspace = true }
ltk-telemetry = { workspace = true }
ltk_overlay = { workspace = true }
parking_lot = { workspace = true }
quick-xml = { workspace = true }
reqwest = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
specta = { workspace = true, optional = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
ltk-manager-assets = { workspace = true, features = ["test-util"] }
ltk-manager-bin = { workspace = true }
ltk-manager-problems = { workspace = true }

glam = { workspace = true }
indexmap = { workspace = true }
ltk_hash = { workspace = true }
ltk_meta = { workspace = true }
tempfile = { workspace = true }
