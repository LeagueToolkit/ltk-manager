[package]
name = "ltk-manager-core"
version = "0.1.0"
description = "UI-agnostic core library for LTK Manager"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LeagueToolkit/ltk-manager"

[features]
# Derive `ts_rs::TS` on core types so the Tauri shell can export bindings for
# types that cross IPC (e.g. `Config` flattened into `Settings`).
ts = ["dep:ts-rs"]

[dependencies]
ritoclient = { workspace = true }

ltk_fantome = { workspace = true }
ltk_file = { workspace = true }
ltk_hash = { workspace = true }
ltk_hashdb = { workspace = true }
ltk_hashtable = { workspace = true }
ltk_meta = { workspace = true }
ltk_mimir_cache = { workspace = true }
ltk_modpkg = { workspace = true }
ltk_mod_project = { workspace = true }
ltk_overlay = { workspace = true }
ltk_rst = { workspace = true }
ltk_texture = { workspace = true }
ltk_wad = { workspace = true }

base64 = { workspace = true }
camino = { workspace = true }
chrono = { workspace = true }
flate2 = { workspace = true }
image = { workspace = true }
indexmap = { workspace = true }
lru = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
rmp-serde = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
sha2 = { workspace = true }
slug = { workspace = true }
tar = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
ts-rs = { workspace = true, optional = true }
uuid = { workspace = true }
walkdir = { workspace = true }
webp = { workspace = true }
zip = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Ioctl",
    "Win32_System_IO",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
assert_matches = { workspace = true }
filetime = { workspace = true }
