[package]
name = "ltk-manager-problems"
version = "0.1.0"
description = "Mod project problems and repairs for LTK Manager"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/LeagueToolkit/ltk-manager"
publish = false

[features]
# Derive `specta::Type` on the types that cross IPC, so the Tauri shell can export bindings.
ts = ["dep:specta", "ltk-manager-assets/ts", "ltk-manager-base/ts", "ltk-manager-bin/ts", "ltk-manager-workshop/ts"]

[dependencies]
ltk-manager-assets = { workspace = true }
ltk-manager-audio = { workspace = true }
ltk-manager-base = { workspace = true }
ltk-manager-bin = { workspace = true }
ltk-manager-workshop = { workspace = true }

camino = { workspace = true }
chrono = { workspace = true }
fs-err = { workspace = true }
image = { workspace = true }
ltk_fantome = { workspace = true }
ltk_file = { workspace = true }
ltk_game_index = { workspace = true, features = ["objects"] }
ltk_hash = { workspace = true }
ltk_hashdb = { workspace = true }
ltk_hashtable = { workspace = true }
ltk_meta = { workspace = true }
ltk_mod_project = { workspace = true }
ltk_modpkg = { workspace = true }
ltk_texture = { workspace = true }
ltk_wad = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
walkdir = { workspace = true }
zip = { workspace = true }
specta = { workspace = true, optional = true }

[dev-dependencies]
ltk-manager-assets = { workspace = true, features = ["test-util"] }
assert_matches = { workspace = true }
image_dds = { workspace = true }
indexmap = { workspace = true }
tempfile = { workspace = true }
