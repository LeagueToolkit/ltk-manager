[package]
name = "ltk-manager-game"
version = "0.1.0"
description = "What League's own classes mean to LTK Manager, read out of an open bin"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/LeagueToolkit/ltk-manager"
publish = false

[features]
# Derive `specta::Type` on what crosses IPC, which takes that of the crates below.
ts = ["dep:specta", "hexshade/ts", "ltk-manager-assets/ts", "ltk-manager-base/ts", "ltk-manager-bin/ts"]

[dependencies]
hexshade = { workspace = true }
ltk-manager-assets = { workspace = true }
ltk-manager-base = { workspace = true }
ltk-manager-bin = { workspace = true }

fs-err = { workspace = true }
glam = { workspace = true }
indexmap = { workspace = true }
ltk_hash = { workspace = true }
ltk_mesh = { workspace = true }
ltk_meta = { workspace = true }
ltk_wad = { workspace = true }

parking_lot = { workspace = true }
rayon = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
specta = { workspace = true, optional = true }
tempfile = { workspace = true }
tracing = { workspace = true }
xxhash-rust = { workspace = true }

[dev-dependencies]
ltk_modpkg = { workspace = true }
ltk_primitives = { workspace = true }
