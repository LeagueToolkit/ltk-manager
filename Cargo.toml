[workspace]
members = [
    "src-tauri",
    "crates/atlas",
    "crates/hexshade",
    "crates/dxbc-spirv-sys",
    "crates/ltk-declarations",
    "crates/ltk-manager-assets",
    "crates/ltk-manager-audio",
    "crates/ltk-manager-base",
    "crates/ltk-manager-bin",
    "crates/ltk-manager-core",
    "crates/ltk-manager-game",
    "crates/ltk-manager-library",
    "crates/ltk-manager-problems",
    "crates/ltk-manager-runeforge",
    "crates/ltk-manager-runtime",
    "crates/ltk-manager-workshop",
    "crates/ltk-meta-docs",
    "crates/ltk-telemetry",
]
resolver = "2"

# Dependencies only, so our own crates stay debuggable. A debug build parses
# bins at 18 MB/s against 144 MB/s optimised, and a library repair is almost
# entirely `ltk_meta` parsing.
[profile.dev.package."*"]
opt-level = 3

# Our own crates too, at the level that keeps them steppable: the bin walk is a
# generic instantiated in the crate that calls it, so the override above never
# reaches it.
[profile.dev.package.ltk-manager-assets]
opt-level = 1

[profile.dev.package.ltk-manager-bin]
opt-level = 1

[profile.dev.package.ltk-manager-library]
opt-level = 1

[profile.dev.package.ltk-manager-problems]
opt-level = 1

[profile.dev.package.ltk-manager-workshop]
opt-level = 1

# The class reads walk the same generic, instantiated in this crate.
[profile.dev.package.ltk-manager-game]
opt-level = 1

# The UI view reads walk it too.
[profile.dev.package.atlas]
opt-level = 1

[workspace.dependencies]
# Pinned to a rev until it ships on crates.io. Declared here rather than in
# `ltk-manager-runtime` so moving the pin is one edit in the place every other
# pinned dependency is written down.
ritoclient = { git = "https://github.com/Crauzer/ritoclient", rev = "f8283eb8f7ac94ffa66ccc9e3f44bbbb2ecbd631" }

# Both crates must be the same release: `ltk_mimir_cache` returns `ltk_hashdb` types.
ltk_hashdb = "0.1.0"
ltk_mimir_cache = "0.1.0"

atlas = { path = "crates/atlas" }
hexshade = { path = "crates/hexshade" }
ltk-declarations = { path = "crates/ltk-declarations" }
ltk-manager-assets = { path = "crates/ltk-manager-assets" }
ltk-manager-audio = { path = "crates/ltk-manager-audio" }
ltk-manager-base = { path = "crates/ltk-manager-base" }
ltk-manager-bin = { path = "crates/ltk-manager-bin" }
ltk-manager-core = { path = "crates/ltk-manager-core" }
ltk-manager-game = { path = "crates/ltk-manager-game" }
ltk-manager-library = { path = "crates/ltk-manager-library" }
ltk-manager-problems = { path = "crates/ltk-manager-problems" }
ltk-manager-runeforge = { path = "crates/ltk-manager-runeforge" }
ltk-manager-runtime = { path = "crates/ltk-manager-runtime" }
ltk-manager-workshop = { path = "crates/ltk-manager-workshop" }
ltk-meta-docs = { path = "crates/ltk-meta-docs" }
ltk-telemetry = { path = "crates/ltk-telemetry" }

ltk_file = { version = "0.2.13", features = ["serde"] }
ltk_hash = { version = "0.5.3", features = ["serde"] }
ltk_meta = { version = "0.9.1", features = ["serde"] }

ltk_fantome = "0.18.2"
ltk_game_data = "0.12.0"
# `rayon` mounts the archives of a chunk index build in parallel.
ltk_game_index = { version = "0.2.0", features = ["rayon"] }
ltk_mod_project = { version = "0.20.1", features = ["modpkg", "fantome"] }
ltk_hashtable = "0.2.2"
ltk_modpkg = "0.12.18"
ltk_overlay = "0.21.1"
ltk_wad = "0.5.10"
# The files a `BankUnit` names: banks, media banks and packages.
ltk_wwise = "0.2.0"
# Wwise Vorbis WEM media to Ogg Vorbis, with the aoTuV codebooks built in.
ww2ogg = "0.1.0"
# Ogg Vorbis decoding, which checks the stream that `ww2ogg` writes.
lewton = "0.10.2"

ltk_anim = "0.3.12"
ltk_mapgeo = "0.3.5"
# Navigation grids and their overlays, for the map editor's navgrid guides.
ltk_navgrid = "0.1"
ltk_mesh = { version = "0.5.5", features = ["tangent-baking"] }
ltk_rst = "0.2.3"
ltk_texture = { version = "0.6.6", features = ["intel-tex"] }

# The `Flags` trait, which lists the named values of `ltk_navgrid::CellFlags`.
bitflags = "2"
brex = "0.2"
camino = "1.2"
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1"
fs-err = "3"
# The vector types `ltk_mesh` hands geometry back as, pinned to the version
# every league-toolkit crate builds against.
glam = "0.27"
# Model files the map editor imports meshes from.
gltf = { version = "1.4.1", default-features = false, features = ["import", "utils", "names", "extras"] }
image = "0.25.2"
image_dds = { version = "0.6", default-features = false, features = ["ddsfile", "image"] }
indexmap = { version = "2", features = ["serde"] }
lru = "0.18"
# The OS credential store API. The token store of each platform is its own crate.
keyring-core = "1.0.1"
minisign-verify = "0.2"
parking_lot = { version = "0.12", features = ["arc_lock"] }
notify = { version = "7", default-features = false }
notify-debouncer-mini = "0.5"
quick-xml = "0.41"
rayon = "1.12"
regex = "1"
reqwest = { version = "0.12", features = ["blocking"] }
semver = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
slug = "0.1"

# The IPC boundary sits on a pre-release pin: `specta` and `tauri-specta` are
# published as release candidates only, and the three crates must move together.
specta = { version = "=2.0.0-rc.25", features = ["derive", "chrono", "indexmap"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["typescript"] }

strum = { version = "0.27", features = ["derive"] }
tar = "0.4"
tempfile = "3"
thiserror = "2"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
tracing = "0.1"
# FBX and OBJ reads for the map editor's mesh import. A C library that its build script compiles.
ufbx = "0.11.5"
uuid = { version = "1", features = ["v4"] }
walkdir = "2.5"
webp = "0.3"
windows-sys = "0.59"
windows-native-keyring-store = "1.1.0"
zip = "2.2.0"
# Lossless YAML: the declarations writer edits `game_data.yaml` in place (#626).
# `rowan` is the tree it is built on, pinned to the same minor.
yaml-edit = { version = "0.3.2", default-features = false }
rowan = "0.16"

rmp-serde = "1"
base64 = "0.22"
sha2 = "0.10"

assert_matches = "1.5"
insta = "1.39"
filetime = "0.2"
ltk_primitives = "0.3.8"
winreg = "0.55"
