[workspace]
members = ["src-tauri", "crates/ltk-manager-core", "crates/ltk-telemetry"]
resolver = "2"

# Dependencies only, so our own crates stay debuggable. A debug build parses
# bins at 18 MB/s against 144 MB/s optimised, and a library repair is almost
# entirely `ltk_meta` parsing.
[profile.dev.package."*"]
opt-level = 3

# Our own crate too, at the level that keeps it steppable: the bin walk is a
# generic instantiated here, so the override above never reaches it.
[profile.dev.package.ltk-manager-core]
opt-level = 1

[workspace.dependencies]
# Pinned to a rev until it ships on crates.io. Declared here rather than in
# `ltk-manager-core` so moving the pin is one edit in the place every other
# pinned dependency is written down.
ritoclient = { git = "https://github.com/Crauzer/ritoclient", rev = "f8283eb8f7ac94ffa66ccc9e3f44bbbb2ecbd631" }

# Pinned to a rev until they ship on crates.io. Both crates must come from the
# same rev: `ltk_mimir_cache` hands back `ltk_hashdb` types.
ltk_hashdb = { git = "https://github.com/LeagueToolkit/mimir", rev = "670196996ae219cbae5e64d40667363ff19a028f" }
ltk_mimir_cache = { git = "https://github.com/LeagueToolkit/mimir", rev = "670196996ae219cbae5e64d40667363ff19a028f" }

ltk-telemetry = { path = "crates/ltk-telemetry" }

ltk_file = { version = "0.2.11", features = ["serde"] }
ltk_hash = { version = "0.4.0", features = ["serde"] }
ltk_meta = { version = "0.8.1", features = ["serde"] }

ltk_fantome = "0.11.0"
ltk_mod_project = { version = "0.9.2", features = ["modpkg", "fantome"] }
ltk_hashtable = "0.1.1"
ltk_modpkg = "0.9.2"
ltk_overlay = "0.9.7"
ltk_wad = "0.5.4"

ltk_anim = "0.3.6"
ltk_mesh = "0.4.5"
ltk_rst = "0.2.1"
ltk_texture = { version = "0.6.0", features = ["intel-tex"] }

camino = "1.2"
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1"
fs-err = "3"
# The vector types `ltk_mesh` hands geometry back as, pinned to the version
# every league-toolkit crate builds against.
glam = "0.27"
image = "0.25.2"
image_dds = { version = "0.6", default-features = false, features = ["ddsfile", "image"] }
indexmap = { version = "2", features = ["serde"] }
lru = "0.18"
parking_lot = "0.12"
quick-xml = "0.41"
rayon = "1.12"
regex = "1"
reqwest = { version = "0.12", features = ["blocking"] }
semver = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
slug = "0.1"

# The IPC boundary sits on a pre-release pin: `specta` and `tauri-specta` are
# published as release candidates only, and the three crates must move together.
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["typescript"] }

strum = { version = "0.27", features = ["derive"] }
tar = "0.4"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
ts-rs = "12"
uuid = { version = "1", features = ["v4"] }
walkdir = "2.5"
webp = "0.3"
windows-sys = "0.59"
zip = "2.2.0"

rmp-serde = "1"
base64 = "0.22"
sha2 = "0.10"

assert_matches = "1.5"
filetime = "0.2"

# `ltk_meta::walk` is on the toolkit's `feat/value-walk` branch (PR 227) and
# not yet on crates.io. Patched rather than pinned as a git dependency, so that
# `ltk_meta` and every other toolkit crate here share one `ltk_hash`: the three
# crates `ltk_meta` pulls by path come from the same rev for the same reason.
# Move the pin to the release that carries it.
[patch.crates-io]
ltk_meta = { git = "https://github.com/LeagueToolkit/league-toolkit", rev = "0bc9d0ea352b8e28d5aeef3c589bd970ed290e38" }
ltk_hash = { git = "https://github.com/LeagueToolkit/league-toolkit", rev = "0bc9d0ea352b8e28d5aeef3c589bd970ed290e38" }
ltk_io_ext = { git = "https://github.com/LeagueToolkit/league-toolkit", rev = "0bc9d0ea352b8e28d5aeef3c589bd970ed290e38" }
ltk_primitives = { git = "https://github.com/LeagueToolkit/league-toolkit", rev = "0bc9d0ea352b8e28d5aeef3c589bd970ed290e38" }
