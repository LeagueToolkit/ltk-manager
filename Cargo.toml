[workspace]
members = ["src-tauri", "crates/ltk-manager-core"]
resolver = "2"

[workspace.dependencies]
# Pinned to a rev until it ships on crates.io. Declared here rather than per
# crate so `ltk-manager-core` and `src-tauri` can never drift onto two revs.
ritoclient-api = { git = "https://github.com/Crauzer/ritoclient", rev = "eb6bf7a8f5c11ca30d698caa4f3e736fb9b57ac2" }

# Pinned to a rev until they ship on crates.io. Both crates must come from the
# same rev: `ltk_mimir_cache` hands back `ltk_hashdb` types.
ltk_hashdb = { git = "https://github.com/LeagueToolkit/mimir", rev = "c3282dfc0f7a03675bddda434b3202b05fe4a6a7" }
ltk_mimir_cache = { git = "https://github.com/LeagueToolkit/mimir", rev = "c3282dfc0f7a03675bddda434b3202b05fe4a6a7" }

ltk_fantome = "0.6.0"
ltk_file = { version = "0.2.8", features = ["serde"] }
ltk_mod_project = "0.5.0"
ltk_modpkg = { version = "0.6.0", features = ["project"] }
ltk_overlay = "0.5.2"
ltk_rst = "0.2.0"
ltk_texture = "0.6.0"
ltk_wad = "0.2.12"

camino = "1.2"
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1"
image = "0.25.2"
indexmap = { version = "2", features = ["serde"] }
lru = "0.18"
regex = "1"
reqwest = { version = "0.12", features = ["blocking"] }
semver = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
slug = "0.1"
tar = "0.4"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
ts-rs = "12"
uuid = { version = "1", features = ["v4"] }
walkdir = "2.5"
webp = "0.3"
windows-sys = "0.59"
xxhash-rust = { version = "0.8.15", features = ["xxh3", "xxh64"] }
zip = "2.2.0"

rmp-serde = "1"
base64 = "0.22"

assert_matches = "1.5"
filetime = "0.2"
